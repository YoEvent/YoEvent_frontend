<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — YowEvent</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d0e12; color: #fff; text-align: center; padding: 24px; box-sizing: border-box;
  }
  .card { max-width: 380px; }
  .badge {
    width: 56px; height: 56px; border-radius: 16px; background: #FF4747;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    font-weight: 900; font-size: 28px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 13px; color: #999; line-height: 1.6; margin: 0 0 20px; }
  button {
    background: #FF4747; color: #fff; border: none; border-radius: 999px;
    padding: 12px 24px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #e03e3e; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Y</div>
    <h1>You're offline</h1>
    <p>YowEvent can't reach the network right now. Some pages and features you've already opened may still work from your device's cache. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
